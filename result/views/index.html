<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Urna · Resultados</title>
  <base href="/index.html">

  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="stylesheets/style.css">
</head>

<body>
  <main class="card">

    <div class="status">
      <span><span class="dot pulse" id="d-socket"></span><b>socket.io</b> <span id="s-socket">conectando…</span></span>
      <span class="sep">·</span>
      <span>última actualización <b id="lastup">—</b></span>
    </div>

    <div class="res">
      <div class="res-bg">
        <i class="ba" id="bg-a" style="width:50%"></i>
        <i class="bb" id="bg-b" style="width:50%"></i>
      </div>

      <div class="res-inner">

        <div class="h2h">
          <div class="side a" id="side-a">
            <span class="nm" id="nm-a">Gatos</span>
            <span class="pc" id="pc-a">50.0</span>
            <span class="ct"><span id="ct-a">0</span> votos</span>
            <span class="lead-chip">En cabeza</span>
          </div>
          <div class="mid">EN VIVO</div>
          <div class="side b" id="side-b">
            <span class="nm" id="nm-b">Perros</span>
            <span class="pc" id="pc-b">50.0</span>
            <span class="ct"><span id="ct-b">0</span> votos</span>
            <span class="lead-chip">En cabeza</span>
          </div>
        </div>

        <div class="res-bar">
          <i class="ba" id="bar-a" style="width:50%"></i>
          <i class="bb" id="bar-b" style="width:50%"></i>
        </div>

        <div class="res-meta">
          <div class="res-total">
            <span class="l">Total emitido</span>
            <span class="n" id="total">0</span>
          </div>
          <div class="spark">
            <span class="l">Ventaja de <span id="nm-a2">Gatos</span> · últimas lecturas</span>
            <svg id="spark" viewBox="0 0 200 40" preserveAspectRatio="none" aria-hidden="true"></svg>
          </div>
        </div>

      </div>
    </div>

    <div class="empty" id="empty">Esperando el primer voto…</div>

  </main>

  <script src="js/socket.io.js"></script>
  <script src="js/app.js"></script>
</body>

</html>

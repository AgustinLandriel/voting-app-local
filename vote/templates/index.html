<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Urna · Votar</title>
  <base href="/index.html">

  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">

  <style>
    :root {
      --bg: #F4F6F8;
      --surface: #FFFFFF;
      --surface-2: #EAEEF3;
      --line: #D7DEE6;
      --line-soft: #E6EBF0;
      --ink: #0F141A;
      --ink-2: #5A6672;
      --ink-3: #8794A2;
      --a: #C0396F;
      --a-soft: #FBEDF3;
      --b: #17847A;
      --b-soft: #E7F4F2;
      --ok: #2C8757;
      --down: #B3402F;
      --shadow: 0 1px 2px rgba(16,24,33,.06), 0 8px 24px -12px rgba(16,24,33,.18);

      --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
      --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0C1015;
        --surface: #141A22;
        --surface-2: #1C242E;
        --line: #29323D;
        --line-soft: #202834;
        --ink: #E8EDF3;
        --ink-2: #97A3B2;
        --ink-3: #6C7987;
        --a: #EE6A9B;
        --a-soft: #2B1621;
        --b: #3EBFB1;
        --b-soft: #10262A;
        --ok: #4FBF7F;
        --down: #E8705C;
        --shadow: 0 1px 2px rgba(0,0,0,.5), 0 12px 28px -14px rgba(0,0,0,.7);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      font-size: 16px;
      line-height: 1.55;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 620px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    /* status strip */
    .status {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      padding: 10px 22px;
      border-bottom: 1px solid var(--line-soft);
      background: var(--surface-2);
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--ink-3);
    }
    .status b { color: var(--ink-2); font-weight: 500; }
    .status .sep { color: var(--line); }

    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--ok);
      display: inline-block;
      margin-right: 7px;
      vertical-align: 1px;
    }
    .dot.down { background: var(--down); }
    .dot.pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

    .body { padding: 34px 30px 30px; }

    .ask { text-align: center; margin-bottom: 26px; }
    .ask h1 {
      font-family: var(--display);
      font-size: 26px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -.015em;
      text-wrap: balance;
    }
    .ask p { margin: 6px 0 0; color: var(--ink-2); font-size: 15px; }

    form { margin: 0; }

    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 560px) { .options { grid-template-columns: 1fr; } }

    .opt {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      padding: 20px 20px 18px;
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      color: var(--ink);
      text-align: left;
      transition: border-color .18s ease, background .18s ease, transform .12s ease;
      overflow: hidden;
    }
    .opt:hover { transform: translateY(-2px); }
    .opt:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .opt[value="a"]:hover, .opt[value="a"].picked { border-color: var(--a); background: var(--a-soft); }
    .opt[value="b"]:hover, .opt[value="b"].picked { border-color: var(--b); background: var(--b-soft); }

    .opt .key {
      position: absolute; top: 14px; right: 14px;
      font-family: var(--mono); font-size: 10px;
      color: var(--ink-3);
      border: 1px solid var(--line); border-radius: 4px;
      padding: 2px 6px;
    }
    .opt .label { font-family: var(--display); font-size: 20px; font-weight: 700; }
    .opt .share { font-family: var(--mono); font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

    .opt .fill { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; transition: width .6s cubic-bezier(.22,.61,.36,1); }
    .opt[value="a"] .fill { background: var(--a); }
    .opt[value="b"] .fill { background: var(--b); }

    .tag {
      display: none;
      font-family: var(--mono);
      font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
      margin-top: 8px; padding: 2px 7px; border-radius: 4px;
      color: var(--surface);
    }
    .opt.picked .tag { display: inline-block; }
    .opt[value="a"] .tag { background: var(--a); }
    .opt[value="b"] .tag { background: var(--b); }

    /* live tally */
    .tally { margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--line-soft); }
    .tally-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 16px; margin-bottom: 12px;
    }
    .eyebrow {
      font-family: var(--mono); font-size: 11px; font-weight: 500;
      letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3);
      display: flex; align-items: center;
    }
    .total { font-family: var(--mono); font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .total strong { color: var(--ink); font-weight: 700; }

    .bar { display: flex; height: 34px; border-radius: 6px; overflow: hidden; background: var(--surface-2); }
    .bar span {
      display: flex; align-items: center;
      font-family: var(--mono); font-size: 12px; font-weight: 700; color: #fff;
      transition: width .7s cubic-bezier(.22,.61,.36,1);
      white-space: nowrap; overflow: hidden;
    }
    .bar .sa { background: var(--a); justify-content: flex-start; padding-left: 11px; }
    .bar .sb { background: var(--b); justify-content: flex-end; padding-right: 11px; }

    .legend {
      display: flex; justify-content: space-between; margin-top: 9px;
      font-family: var(--mono); font-size: 11.5px; color: var(--ink-2);
      font-variant-numeric: tabular-nums;
    }
    .swatch { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; }

    .foot {
      margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line-soft);
      font-family: var(--mono); font-size: 11px; color: var(--ink-3);
      display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .foot a { color: var(--ink-2); }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>

<body>
  <main class="card">

    <div class="status">
      <span><span class="dot pulse" id="d-redis"></span><b>redis</b> <span id="s-redis">…</span></span>
      <span class="sep">·</span>
      <span><span class="dot" id="d-db"></span><b>postgres</b> <span id="s-db">…</span></span>
      <span class="sep">·</span>
      <span>pod <b>{{ hostname }}</b></span>
    </div>

    <div class="body">

      <div class="ask">
        <h1>¿{{ option_a }} o {{ option_b }}?</h1>
        <p>Un voto por persona. Podés cambiarlo cuando quieras.</p>
      </div>

      <form method="POST" id="voteForm">
        <div class="options">
          <button class="opt {% if vote == 'a' %}picked{% endif %}"
                  type="submit" name="vote" value="a" id="opt-a">
            <span class="key">A</span>
            <span class="label">{{ option_a }}</span>
            <span class="share" id="sh-a">—</span>
            <span class="tag">Tu voto</span>
            <span class="fill" id="fl-a"></span>
          </button>
          <button class="opt {% if vote == 'b' %}picked{% endif %}"
                  type="submit" name="vote" value="b" id="opt-b">
            <span class="key">B</span>
            <span class="label">{{ option_b }}</span>
            <span class="share" id="sh-b">—</span>
            <span class="tag">Tu voto</span>
            <span class="fill" id="fl-b"></span>
          </button>
        </div>
      </form>

      <div class="tally">
        <div class="tally-head">
          <span class="eyebrow"><span class="dot pulse"></span>Recuento en vivo</span>
          <span class="total"><strong id="total">0</strong> votos</span>
        </div>
        <div class="bar">
          <span class="sa" id="bar-a" style="width:50%">50%</span>
          <span class="sb" id="bar-b" style="width:50%">50%</span>
        </div>
        <div class="legend">
          <span><span class="swatch" style="background:var(--a)"></span>{{ option_a }} <span id="ct-a">0</span></span>
          <span><span class="swatch" style="background:var(--b)"></span>{{ option_b }} <span id="ct-b">0</span></span>
        </div>
      </div>

      <div class="foot">
        <span>Teclas A y B para votar</span>
        <span>Actualizado <span id="lastup">—</span></span>
      </div>

    </div>
  </main>

  <script>
  (function () {
    "use strict";

    var el = function (id) { return document.getElementById(id); };

    function stamp() {
      var d = new Date();
      return String(d.getHours()).padStart(2, "0") + ":" +
             String(d.getMinutes()).padStart(2, "0") + ":" +
             String(d.getSeconds()).padStart(2, "0");
    }

    // ---- recuento en vivo contra /stats (ya existe en app.py) ----
    function paintStats(d) {
      var a = d.cats_votes || 0;
      var b = d.dogs_votes || 0;
      var t = a + b;
      var pa = t ? (a / t * 100) : 50;
      var pb = 100 - pa;

      el("sh-a").textContent = pa.toFixed(1) + " %";
      el("sh-b").textContent = pb.toFixed(1) + " %";
      el("fl-a").style.width = pa + "%";
      el("fl-b").style.width = pb + "%";

      el("bar-a").style.width = pa + "%";
      el("bar-b").style.width = pb + "%";
      el("bar-a").textContent = Math.round(pa) + "%";
      el("bar-b").textContent = Math.round(pb) + "%";

      el("ct-a").textContent = a;
      el("ct-b").textContent = b;
      el("total").textContent = t.toLocaleString("es-AR");
      el("lastup").textContent = stamp();
    }

    function pollStats() {
      fetch("/stats", { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(paintStats)
        .catch(function () { /* la app sigue usable sin recuento */ });
    }

    // ---- salud contra /healthz (ya existe en app.py) ----
    function paintHealth(d) {
      var map = [["redis", "d-redis", "s-redis"], ["database", "d-db", "s-db"]];
      map.forEach(function (m) {
        var ok = d[m[0]] === "OK";
        el(m[1]).classList.toggle("down", !ok);
        el(m[2]).textContent = ok ? "conectado" : "sin conexión";
      });
    }

    function pollHealth() {
      fetch("/healthz", { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(paintHealth)
        .catch(function () {
          el("d-redis").classList.add("down");
          el("d-db").classList.add("down");
          el("s-redis").textContent = el("s-db").textContent = "sin datos";
        });
    }

    // ---- atajos de teclado ----
    document.addEventListener("keydown", function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var k = e.key.toLowerCase();
      if (k === "a" || k === "b") el("opt-" + k).click();
    });

    pollStats();
    pollHealth();
    setInterval(pollStats, 2000);
    setInterval(pollHealth, 10000);
  })();
  </script>
</body>

</html>

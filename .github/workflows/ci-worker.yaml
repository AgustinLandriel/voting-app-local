name: worker - Build and Push ECR Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "worker/**"
  pull_request:
    branches:
      - main
    paths:
      - "worker/**"

# Los tres workflows (worker, vote, result) commitean al mismo repo de GitOps.
# Sin esto, dos que corran a la vez chocan en el git push y uno falla.
# El grupo compartido los pone en fila en vez de cancelarlos.
concurrency:
  group: gitops-update-${{ github.workflow}}
  cancel-in-progress: false

# Visibles desde cualquier paso. El contexto github ya existe cuando esto se
# evalua; las salidas de un step (login-ecr) todavia no, por eso ECR_REGISTRY
# se declara mas abajo, en cada paso que la necesita.
env:
  ECR_REPOSITORY: voting-app/worker
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Instalar Snyk CLI
        uses: snyk/actions/setup@master

      # SCA: revisa el arbol de dependencias ANTES de meterlo en la imagen.
      # Lee el package-lock.json directo, no hace falta npm install.
      # continue-on-error: reporta pero no bloquea, igual que Trivy.
      - name: Escanear dependencias con Snyk
        continue-on-error: true
        working-directory: ./worker
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=high
      # ─────────────────────────────────────────────────────────
      # Corre SIEMPRE: en el PR y en el merge.
      # Si esto falla, el PR no se puede aprobar.
      # ─────────────────────────────────────────────────────────
      - name: Build de la imagen
        run: docker build -t worker:$IMAGE_TAG ./worker

      # Escanea la imagen ANTES de subirla: si algo critico aparece, nunca
      # llega a ECR. Corre tambien en los PR, que es donde conviene enterarse.
      # Con exit-code 0 solo reporta; poner 1 para que bloquee de verdad.
      - name: Escanear la imagen con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: worker:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0

      # ─────────────────────────────────────────────────────────
      # De aca para abajo, solo cuando el codigo ya esta en main.
      # En un PR estos pasos ni se ejecutan, asi que tampoco se
      # cargan las credenciales de AWS.
      # ─────────────────────────────────────────────────────────
      - name: Configurar credenciales AWS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Login a Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag y push a ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag worker:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Instalar Kustomize
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -sL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update GitOps Repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # 1. Clonar el repo de GitOps con el token personal (PAT)
          git clone https://x-access-token:${{ secrets.GITOPS_PAT }}@github.com/AgustinLandriel/voting-app-argocd.git
          cd voting-app-argocd/k8s/worker

          # 2. Identidad para el commit automatico
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # 3. Actualizar el tag en kustomization.yaml. A diferencia de sed,
          #    Kustomize entiende el YAML: toca solo esta imagen y ninguna otra.
          kustomize edit set image $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          # 4. Commit y push. ArgoCD detecta el cambio y despliega.
          git add .
          git commit -m "Update worker image tag to $IMAGE_TAG"
          git push origin main

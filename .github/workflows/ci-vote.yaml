name: vote - Build and Push ECR Image

on:
  push:
    branches:
      - main
    paths:
      - "vote/**"
  pull_request:
    branches:
      - main
    paths:
      - "vote/**"

# Los tres workflows (worker, vote, result) commitean al mismo repo de GitOps.
# Sin esto, dos que corran a la vez chocan en el git push y uno falla.
# El grupo compartido los pone en fila en vez de cancelarlos.
concurrency:
  group: gitops-update
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout del codigo
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────
      # Corre SIEMPRE: en el PR y en el merge.
      # Si esto falla, el PR no se puede aprobar.
      # ─────────────────────────────────────────────────────────
      - name: Build de la imagen
        run: docker build -t vote:${{ github.sha }} ./vote

      # ─────────────────────────────────────────────────────────
      # De aca para abajo, solo cuando el codigo ya esta en main.
      # En un PR estos pasos ni se ejecutan, asi que tampoco se
      # cargan las credenciales de AWS.
      # ─────────────────────────────────────────────────────────
      - name: Configurar credenciales AWS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Login a Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag y push a ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: voting-app/vote
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag vote:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update GitOps Repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # 1. Clonar el repo de GitOps con el token personal (PAT)
          git clone https://x-access-token:${{ secrets.GITOPS_PAT }}@github.com/AgustinLandriel/voting-app-argocd.git
          cd voting-app-argocd

          # 2. Identidad para el commit automatico
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # 3. Actualizar el tag de la imagen
          sed -i "s|image: .*|image: ${{ steps.login-ecr.outputs.registry }}/voting-app/vote:${{ github.sha }}|g" k8s/vote/vote.yaml

          # 4. Commit y push. ArgoCD detecta el cambio y despliega.
          git add .
          git commit -m "Update vote image tag to ${{ github.sha }}"
          git push origin main

name: vote - Build and Push ECR Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "vote/**"
  pull_request:
    branches:
      - main
    paths:
      - "vote/**"

# Los tres workflows (worker, vote, result) commitean al mismo repo de GitOps.
# Sin esto, dos que corran a la vez chocan en el git push y uno falla.
# El grupo compartido los pone en fila en vez de cancelarlos.
concurrency:
  group: gitops-update-${{ github.workflow}}
  cancel-in-progress: false

# Visibles desde cualquier paso. El contexto github ya existe cuando esto se
# evalua; las salidas de un step (login-ecr) todavia no, por eso ECR_REGISTRY
# se declara mas abajo, en cada paso que la necesita.
env:
  ECR_REPOSITORY: voting-app/vote
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout del codigo
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # requirements.txt sólo lista las 9 deps directas, no el arbol completo.
      # Instalandolas, Snyk ve tambien las transitivas.
      - name: Instalar dependencias
        working-directory: ./vote
        run: pip install -r requirements.txt

      - name: Instalar Snyk CLI
        uses: snyk/actions/setup@master

      - name: Escanear dependencias con Snyk
        continue-on-error: true
        working-directory: ./vote
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=high

      # snyk test (arriba) solo reporta en el log; no publica nada.
      # snyk monitor sube la foto del arbol a app.snyk.io y avisa cuando
      # se descubre una CVE nueva en algo que ya tenemos instalado, sin
      # necesidad de correr un build.
      # Solo en main: en los PR ensuciaria el dashboard con una rama por PR.
      - name: Publicar dependencias en Snyk
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        working-directory: ./vote
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor

      # ─────────────────────────────────────────────────────────
      # Corre SIEMPRE: en el PR y en el merge.
      # Si esto falla, el PR no se puede aprobar.
      # ─────────────────────────────────────────────────────────
      - name: Build de la imagen
        run: docker build -t vote:$IMAGE_TAG ./vote

      # Escanea la imagen ANTES de subirla: si algo critico aparece, nunca
      # llega a ECR. Corre tambien en los PR, que es donde conviene enterarse.
      # Con exit-code 0 solo reporta; poner 1 para que bloquee de verdad.
      - name: Escanear la imagen con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: vote:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0

      # ─────────────────────────────────────────────────────────
      # De aca para abajo, solo cuando el codigo ya esta en main.
      # En un PR estos pasos ni se ejecutan, asi que tampoco se
      # cargan las credenciales de AWS.
      # ─────────────────────────────────────────────────────────
      - name: Configurar credenciales AWS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Login a Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag y push a ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag vote:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update GitOps Repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # 1. Clonar el repo de GitOps con el token personal (PAT)
          git clone https://x-access-token:${{ secrets.GITOPS_PAT }}@github.com/AgustinLandriel/voting-app-argocd.git
          cd voting-app-argocd

          # 2. Identidad para el commit automatico
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # 3. Actualizar el tag de la imagen
          sed -i "s|image: .*|image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|g" k8s/vote/vote.yaml

          # 4. Commit y push. ArgoCD detecta el cambio y despliega.
          git add .
          git commit -m "Update vote image tag to $IMAGE_TAG"
          git push origin main
